<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#167561" />
    <title>ČOV Monitor · Provozní přehled</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/documentation.css" />
  </head>
  <body>
    <!-- Společná kostra. Obsah jednotlivých obrazovek je v js/pages/. -->
    <aside>
      <a class="brand" href="#overview">
        <span class="logo">≈</span>
        <span>
          ČOV
          <span class="light">monitor</span>
          <small>PROVOZNÍ MONITORING</small>
        </span>
      </a>
      <div class="station">
        <span class="dot"></span>
        Domovní ČOV
        <small>BC 4 OPTIMA · Stanice 01</small>
      </div>
      <div class="navlabel">MOJE ČOV</div>
      <nav id="nav" aria-label="Hlavní navigace"></nav>
      <div class="sidebottom">
        <span class="demoicon">◈</span>
        <b>Domácí monitoring</b>
        <p>Data přijímá domácí server.</p>
        <button id="theme" class="theme">◐ &nbsp; Tmavý režim</button>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <div>
          <span class="breadcrumb">Moje ČOV</span>
          <span class="slash">/</span>
          <span id="crumb">Přehled</span>
        </div>
        <div class="headerRight">
          <span class="testbadge">STANICE · HTTP</span>
          <span id="clock"></span>
          <button id="logout" class="btn" hidden>Odhlásit</button>
        </div>
      </header>
      <main id="main"></main>
      <footer>
        <span>
          <span class="dot"></span>
          ČOV Monitor
          <span class="muted">/ Provoz stanice</span>
        </span>
        <span>Nezávislý monitoring · v0.2.0</span>
      </footer>
    </div>
    <div id="toast" role="status"></div>
    <section
      id="alarm-notifications"
      aria-label="Upozornění ze stanice"
      hidden
    ></section>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
